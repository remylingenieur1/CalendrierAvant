<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#050609">
    <title>OSTINATO</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>
<body>
    <main class="exhibit">
        <div class="shadow" aria-hidden="true"></div>
        <div class="viewport" tabindex="0" role="button"
             aria-label="Kinetic sculpture. Drag to rotate, tap or press Enter to change its density, Space to pause, and arrow keys to rotate.">
            <div class="camera" aria-hidden="true">
                <div class="sculpture">
                    <div class="rim"></div>
                    <div class="vanes"></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
