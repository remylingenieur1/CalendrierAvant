<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll.. Roll & Bounce</title>
  </head>
  <body>
    <div class="scroll-space" aria-hidden="true"></div>
    <main class="stage">
      <canvas id="world" aria-label="Interactive rolling and bouncing ball on a gently hilly landscape"></canvas>
      <header class="top">
        <div class="title">SCROLL.. ROLL &amp; BOUNCE</div>
      </header>
      <footer class="bottom">
        <div class="hint">
          <span>Scroll / Swipe to Roll</span>
          <span class="separator" aria-hidden="true">·</span>
          <span>Click / Tap to Jump</span>
        </div>
        <div class="hud">
          <button class="reset" id="reset" type="button">Restart</button>
        </div>
      </footer>
    </main>
    <div class="cursor-ring" id="cursor-ring" aria-hidden="true"></div>
    <script src="./script.js"></script>
  </body>
</html>
