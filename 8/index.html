<!doctype html>
<html lang="en" data-mood="dark" class="is-instant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guthrie Theater snow globe</title>
<meta name="description" content="A snow globe of the Guthrie Theater that follows the real sun and weather in Minneapolis.">
<meta name="theme-color" content="#1A1A1A">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://api.open-meteo.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  /* The switch is Lucy's Light / Sunset / Dark toggle. Its colours are registered
     custom properties, so the track, the knob and the page ease between moods. */
  @property --bg    { syntax: "<color>"; inherits: true; initial-value: #1A1A1A; }
  @property --t1    { syntax: "<color>"; inherits: true; initial-value: #2D253A; }
  @property --t2    { syntax: "<color>"; inherits: true; initial-value: #574777; }
  @property --t3    { syntax: "<color>"; inherits: true; initial-value: #6A578F; }
  @property --stop  { syntax: "<color>"; inherits: true; initial-value: #BEADD6; }
  @property --knob  { syntax: "<color>"; inherits: true; initial-value: #1A1A1A; }
  @property --glyph { syntax: "<color>"; inherits: true; initial-value: #AB8CF0; }
  @property --rim   { syntax: "<color>"; inherits: true; initial-value: #574777; }
  @property --text  { syntax: "<color>"; inherits: true; initial-value: #F6F6F4; }

  :root {
    --bg: #1A1A1A; --t1: #2D253A; --t2: #574777; --t3: #6A578F; --stop: #BEADD6;
    --knob: #1A1A1A; --glyph: #AB8CF0; --rim: #574777; --text: #F6F6F4;
    --shade: rgba(20, 12, 30, 0.34);          /* darkens a filled control so its label stays readable */
    --heavy: cubic-bezier(0.65, 0, 0.35, 1);
    --settle: cubic-bezier(0.16, 1, 0.3, 1);
    --smooth: cubic-bezier(0.22, 1, 0.36, 1);
    --t: 700ms;
    --quick: 150ms; --fast: 250ms; --medium: 350ms; --slow: 400ms; --very-slow: 500ms;
    --w: 232px; --h: 88px; --pad: 8px;
    --knob-size: calc(var(--h) - var(--pad) * 2);
    --travel: calc((var(--w) - var(--pad) * 2 - var(--knob-size)) / 2);
    --edge-l: max(28px, env(safe-area-inset-left, 0px)); --edge-r: max(28px, env(safe-area-inset-right, 0px));
    color-scheme: dark;
    transition:
      --bg var(--t) var(--heavy), --t1 var(--t) var(--heavy), --t2 var(--t) var(--heavy),
      --t3 var(--t) var(--heavy), --stop var(--t) var(--heavy), --knob var(--t) var(--heavy),
      --glyph var(--t) var(--heavy), --rim var(--t) var(--heavy), --text var(--t) var(--heavy);
  }
  :root[data-mood="light"] {
    --bg: #F6F6F4; --t1: #EEE9F6; --t2: #DCCFF6; --t3: #C4B0EE; --stop: #6A578F;
    --knob: #FFFFFF; --glyph: #6A578F; --rim: #C4B0EE; --text: #2D253A; --shade: rgba(255, 255, 255, 0);
    color-scheme: light;
  }
  :root[data-mood="sunset"] {
    --bg: #2D253A; --t1: #574777; --t2: #B4607E; --t3: #E2A06E; --stop: #FFF4EC;
    --knob: #2D253A; --glyph: #E2A06E; --rim: #E2C184; --text: #FFF4EC; --shade: rgba(34, 20, 44, 0.46);
    color-scheme: dark;
  }
  :root.is-instant, :root.is-instant * { transition: none !important; }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow: hidden; }

  /* The page takes a little of the live sky's colour. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 85% at 50% 40%, var(--sky, transparent), transparent 72%);
    opacity: 0.22;
  }
  .grain {
    position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0.09; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  #stage { position: fixed; inset: 0; z-index: 1; touch-action: none; cursor: grab; }
  #stage:active { cursor: grabbing; }
  .has-cursor #stage, .has-cursor #stage:active { cursor: none; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  /* Corners, set like a museum label. */
  .corner { position: fixed; z-index: 2; top: max(26px, env(safe-area-inset-top)); pointer-events: none; }
  .corner--tl { left: var(--edge-l); }
  .corner--tr { right: var(--edge-r); text-align: right; }
  .place { margin: 0; font: italic 600 clamp(19px, 1.7vw, 24px)/1.15 "Playfair Display", Georgia, serif; }
  .small { margin: 5px 0 0; font-size: 13px; line-height: 1.4; color: var(--stop); }
  .read-big { margin: 0; font: 600 clamp(19px, 1.7vw, 24px)/1.15 "Inter", sans-serif; font-variant-numeric: tabular-nums; }
  .swap { animation: swap var(--quick) ease-in-out; }
  @keyframes swap { from { opacity: 0; filter: blur(2px); } }

  /* The bottom band: signature, dock, sound. */
  .panel {
    position: fixed; left: 0; right: 0; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 2; pointer-events: none;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; column-gap: 16px; padding: 0 var(--edge-r) 0 var(--edge-l);
  }
  .panel > * { pointer-events: auto; }
  .sig { grid-column: 1; grid-row: 1; justify-self: start; margin: 0; font-size: 12px; line-height: 1.3; color: var(--stop); }
  .sig a {
    display: inline-block; margin-top: 2px; padding: 4px 0; color: var(--text); text-decoration: none;
    font: italic 600 19px/1.2 "Playfair Display", Georgia, serif;
    background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat; transition: background-size var(--fast) var(--smooth);
  }
  .sig a:focus-visible { background-size: 100% 1px; }
  @media (hover: hover) { .sig a:hover { background-size: 100% 1px; } }
  .sig a:focus-visible { outline: 2px solid var(--glyph); outline-offset: 4px; border-radius: 2px; }
  .dockwrap { grid-column: 2; grid-row: 1; display: grid; justify-items: center; gap: 12px; pointer-events: none; }
  .dockwrap > * { pointer-events: auto; }
  .dock { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 10px 12px; }
  .side { grid-column: 3; grid-row: 1; justify-self: end; }
  button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

  /* The line above the dock: says when the view is a preview, and offers a hint once. */
  .toast {
    margin: 0; min-height: 20px; font-size: 13px; line-height: 20px; color: var(--stop); text-align: center; pointer-events: none;
    opacity: 0; transform: translateY(8px); filter: blur(3px);
    transition: opacity var(--medium) ease-in-out, transform var(--medium) var(--smooth), filter var(--medium) ease-in-out;
  }
  .toast.is-shown { opacity: 1; transform: none; filter: none; transition-duration: var(--slow); }
  .toast b { font-weight: 600; color: var(--text); }

  /* One rule for every control: on is filled, off is bare. */
  .live {
    display: inline-flex; align-items: center; gap: 10px; height: 72px; padding: 0 26px 0 22px;
    border: 0; border-radius: 999px; background: none; color: var(--stop); cursor: pointer;
    font: 600 15px/1 "Inter", sans-serif; letter-spacing: 0.01em;
    transition: color var(--quick) ease-out, transform 80ms ease-out;
    position: relative; isolation: isolate;
  }
  .live::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; opacity: 0; transform: scale(0.96);
    background: linear-gradient(var(--shade), var(--shade)), linear-gradient(120deg, var(--t1) 0%, var(--t2) 55%, var(--t3) 100%);
    box-shadow: inset 0 0 0 1px var(--rim);
    transition: opacity var(--fast) var(--smooth), transform var(--fast) var(--smooth);
  }
  @media (hover: hover) { .live:hover { color: var(--text); } }
  .live:active { transform: scale(0.97); }
  .live:focus-visible { outline: 2px solid var(--glyph); outline-offset: 3px; }
  .live[aria-pressed="true"] { color: var(--text); }
  .live[aria-pressed="true"]::before { opacity: 1; transform: none; }
  .live__dot { width: 9px; height: 9px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; transition: transform var(--very-slow) cubic-bezier(0.34, 1.36, 0.64, 1); transform: scale(0.8); }
  .live[aria-pressed="true"] .live__dot { background: #F0746C; box-shadow: none; transform: scale(1); animation: live-pulse 2.4s ease-in-out infinite; }
  .live.is-offline .live__dot { background: none; box-shadow: inset 0 0 0 1.5px currentColor; animation: none; }
  @keyframes live-pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(240, 116, 108, 0.6); } 60% { box-shadow: 0 0 0 8px rgba(240, 116, 108, 0); } }

  .round {
    position: relative; isolation: isolate; display: grid; place-items: center; width: 48px; height: 48px; padding: 0;
    border: 0; border-radius: 50%; background: none; color: var(--stop); cursor: pointer;
    transition: color var(--quick) ease-out, transform 80ms ease-out;
  }
  .round::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: 50%; opacity: 0; transform: scale(0.9);
    background: linear-gradient(var(--shade), var(--shade)), linear-gradient(120deg, var(--t1) 0%, var(--t2) 55%, var(--t3) 100%);
    box-shadow: inset 0 0 0 1px var(--rim);
    transition: opacity var(--quick) ease-out, transform var(--fast) var(--smooth);
  }
  @media (hover: hover) { .round:hover { color: var(--text); } }
  .round:active { transform: scale(0.92); }
  .round:focus-visible { outline: 2px solid var(--glyph); outline-offset: 3px; }
  .round[aria-pressed="true"] { color: var(--text); }
  .round[aria-pressed="true"]::before { opacity: 1; transform: none; }
  .round svg { width: 22px; height: 22px; overflow: visible; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .weather { display: inline-flex; gap: 2px; }

  /* Snow turns in, then keeps turning slowly while it snows. */
  #snow svg { transition: transform var(--very-slow) var(--settle); }
  #snow[aria-pressed="true"] svg { transform: rotate(60deg) scale(1.1); animation: flake 14s linear var(--very-slow) infinite; }
  @keyframes flake { from { transform: rotate(60deg) scale(1.1); } to { transform: rotate(420deg) scale(1.1); } }
  /* Rain: the drops fall while it rains. */
  .drop { transform-box: fill-box; }
  #rain[aria-pressed="true"] .drop { animation: drop 0.9s ease-in calc(var(--n) * 0.22s) infinite; }
  @keyframes drop { 0% { transform: translateY(-2px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(4px); opacity: 0; } }
  /* Shake: a quick wiggle on press. */
  #shake:active svg { animation: wiggle 240ms ease-in-out; }
  @keyframes wiggle { 0%, 100% { transform: rotate(0); } 33% { transform: rotate(-13deg); } 66% { transform: rotate(11deg); } }

  /* Sound: two icons in one slot. */
  .swapicon { position: relative; width: 22px; height: 22px; }
  .swapicon svg { position: absolute; inset: 0; transition: opacity var(--fast) ease-in-out, transform var(--fast) ease-in-out, filter var(--fast) ease-in-out; }
  #soundBtn[aria-pressed="true"] .icon-off, #soundBtn[aria-pressed="false"] .icon-on { opacity: 0; transform: scale(0.6); filter: blur(2px); }

  /* Labels that appear on hover or focus. */
  [data-tip]::after {
    content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 10px); z-index: 3; pointer-events: none; white-space: nowrap;
    padding: 6px 10px; border-radius: 2px; background: var(--text); color: var(--bg); font: 500 12px/1 "Inter", sans-serif;
    opacity: 0; transform: translateX(-50%) scale(0.98); transform-origin: 50% 100%;
  }
  [data-tip]:focus-visible::after { opacity: 1; transform: translateX(-50%) scale(1); transition: opacity var(--quick) ease-out 80ms, transform var(--quick) ease-out 80ms; }
  @media (hover: hover) { [data-tip]:hover::after { opacity: 1; transform: translateX(-50%) scale(1); transition: opacity var(--quick) ease-out 80ms, transform var(--quick) ease-out 80ms; } }
  .toggle [data-tip]::after { font-size: 14.6px; padding: 7px 12px; bottom: calc(100% + 16px); }
  .side [data-tip]::after { left: auto; right: 0; transform: scale(0.98); transform-origin: 100% 100%; }
  .side [data-tip]:focus-visible::after { transform: scale(1); }
  @media (hover: hover) { .side [data-tip]:hover::after { transform: scale(1); } }

  /* The switch, at a size that leaves the globe in charge. */
  .toggle-wrap { width: 190px; height: 72px; }
  .toggle-wrap .toggle { transform: scale(0.8182); transform-origin: 0 0; }

  /* Track */
  .toggle {
    --i: 2; position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center;
    width: var(--w); height: var(--h); padding: var(--pad); border-radius: 999px;
    background: linear-gradient(120deg, var(--t1) 0%, var(--t2) 55%, var(--t3) 100%);
    box-shadow: inset 0 0 0 1px var(--rim);
  }
  .toggle__stop {
    position: relative; z-index: 1; display: grid; place-items: center; height: var(--knob-size); padding: 0; border: 0;
    border-radius: 50%; background: none; color: var(--stop); opacity: 0.75; cursor: pointer;
    transition: opacity 300ms ease; -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) { .toggle__stop:hover { opacity: 1; } }
  .toggle__stop[aria-checked="true"] { opacity: 0; }
  .toggle__stop:focus-visible { opacity: 1; outline: 2px solid var(--glyph); outline-offset: 2px; }
  .toggle__stop svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: transform 600ms var(--settle); }
  @media (hover: hover) { .toggle__stop[data-mood="light"]:hover svg { transform: rotate(45deg) scale(1.1); } }
  @media (hover: hover) { .toggle__stop[data-mood="dark"]:hover svg { transform: rotate(-18deg) scale(1.1); } }
  @media (hover: hover) { .toggle__stop[data-mood="sunset"]:hover svg { transform: translateY(-2px) scale(1.1); } }

  .toggle__knob {
    position: absolute; z-index: 2; top: var(--pad); left: var(--pad); width: var(--knob-size); height: var(--knob-size);
    pointer-events: none; transform: translateX(calc(var(--i) * var(--travel))); transition: transform 640ms var(--heavy);
  }
  .toggle__face {
    position: absolute; inset: 0; display: grid; place-items: center; border-radius: 50%; background: var(--knob); color: var(--glyph);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22), inset 0 0 0 1px var(--rim);
  }
  .glyph { position: absolute; width: 48px; height: 48px; overflow: visible; opacity: 0; transform: rotate(-70deg) scale(0.5); transition: opacity 360ms ease, transform 760ms var(--settle); }
  .ray, .sun-core, .moon-body, .star, .sunset-glow, .sunset-sun, .sunset-ripple { transform-box: fill-box; transform-origin: center; }
  :root[data-mood="light"] .glyph--sun, :root[data-mood="dark"] .glyph--moon, :root[data-mood="sunset"] .glyph--sunset { opacity: 1; transform: rotate(0deg) scale(1); transition-delay: 160ms; }

  .ray { stroke: #E2A06E; stroke-width: 2.4; stroke-linecap: round; transform-origin: center bottom; }
  .sun-rays { transform-origin: 24px 24px; transform-box: view-box; }
  :root[data-mood="light"] .ray { animation: ray-in 520ms var(--settle) calc(260ms + var(--n) * 40ms) backwards; }
  :root[data-mood="light"] .sun-rays { animation: spin 26s linear 900ms infinite; }
  :root[data-mood="light"] .sun-core { animation: core-in 700ms var(--settle) 160ms backwards; }

  .star { fill: #F6F6F4; opacity: 0; }
  :root[data-mood="dark"] .star { animation: star-in 520ms var(--settle) calc(420ms + var(--d) * 80ms) forwards, twinkle 2.6s ease-in-out calc(1100ms + var(--d) * 380ms) infinite; }
  :root[data-mood="dark"] .moon-body { animation: moon-in 800ms var(--settle) 160ms backwards; }

  .sunset-line { stroke: #E2C184; stroke-width: 1.8; stroke-linecap: round; }
  .sunset-ripple { stroke: #E2A06E; stroke-width: 1.6; stroke-linecap: round; opacity: 0.75; }
  .sunset-glow { opacity: 0; }
  :root[data-mood="sunset"] .sunset-glow { animation: glow-in 900ms var(--settle) 200ms forwards, breathe 3.4s ease-in-out 1100ms infinite; }
  :root[data-mood="sunset"] .sunset-sun { animation: sink 900ms var(--settle) 160ms backwards; }
  :root[data-mood="sunset"] .sunset-ripple { animation: ripple-in 600ms var(--settle) calc(500ms + var(--n) * 120ms) backwards, shimmer 3.4s ease-in-out calc(1100ms + var(--n) * 300ms) infinite; }

  @keyframes spin      { to { transform: rotate(360deg); } }
  @keyframes ray-in    { from { transform: scaleY(0); opacity: 0; } }
  @keyframes core-in   { from { transform: scale(0.6); } }
  @keyframes moon-in   { from { transform: rotate(-35deg) scale(0.7); } }
  @keyframes star-in   { from { opacity: 0; transform: scale(0) rotate(-45deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }
  @keyframes twinkle   { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.7); } }
  @keyframes glow-in   { from { opacity: 0; transform: scale(0.4); } to { opacity: 1; transform: scale(1); } }
  @keyframes breathe   { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.12); } }
  @keyframes sink      { from { transform: translateY(-9px); } }
  @keyframes ripple-in { from { transform: scaleX(0); opacity: 0; } }
  @keyframes shimmer   { 0%, 100% { opacity: 0.75; } 50% { opacity: 0.35; } }

  /* The entrance: after the globe lands, the corners and the dock rise in, one after another. */
  .enter { opacity: 0; transform: translateY(12px); filter: blur(3px); }
  .is-ready .enter {
    opacity: 1; transform: none; filter: none;
    transition: opacity var(--very-slow) ease-in-out calc(1100ms + var(--e) * 80ms), transform var(--very-slow) var(--smooth) calc(1100ms + var(--e) * 80ms), filter var(--very-slow) ease-in-out calc(1100ms + var(--e) * 80ms);
  }

  /* A label that follows the pointer over the globe. */
  .cursor {
    position: fixed; left: 0; top: 0; z-index: 4; pointer-events: none; width: 68px; height: 68px; margin: -34px 0 0 -34px; border-radius: 50%;
    display: grid; place-items: center; font: 600 12px/1 "Inter", sans-serif; color: var(--text);
    background: color-mix(in srgb, var(--bg) 55%, transparent); box-shadow: inset 0 0 0 1px var(--rim); backdrop-filter: blur(6px);
    opacity: 0; scale: 0.5; transition: opacity var(--quick) ease-out, scale var(--fast) var(--smooth);
  }
  .cursor.is-on { opacity: 1; scale: 1; }
  .cursor.is-down { scale: 0.42; }
  .cursor.is-down span { opacity: 0; }

  .loading { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; margin: 0; pointer-events: none; transition: opacity var(--very-slow) ease-in-out; }
  .mast { position: relative; width: 44px; height: min(240px, 40vh); background: #1638E0; overflow: hidden; transform-origin: 50% 100%; animation: mast-rise var(--very-slow) cubic-bezier(0.22, 1, 0.36, 1) both; }
  .mast__run { display: block; animation: mast-scroll 3.6s linear -1.3s infinite; }
  .mast__run span { display: block; height: 30px; font: 600 20px/30px Inter, system-ui, sans-serif; color: #fff; text-align: center; }
  .mast__run span:nth-child(7n) { margin-bottom: 90px; }
  .mast__run span:first-child { margin-top: min(240px, 40vh); }
  @keyframes mast-rise { from { transform: scaleY(0); } }
  @keyframes mast-scroll { to { transform: translateY(-300px); } }
  .is-ready .mast__run, .no-gl .mast__run, .load-failed .mast__run { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .mast, .mast__run { animation: none; } .mast__run span:first-child { margin-top: 15px; } }
  .is-ready .loading, .no-gl .loading, .load-failed .loading { opacity: 0; }
  .no-gl .enter, .load-failed .enter { opacity: 1; transform: none; filter: none; }
  .fail { position: fixed; inset: 0; z-index: 3; display: none; place-items: center; text-align: center; padding: 24px; color: var(--stop); }
  .no-gl .fail--gl, .load-failed:not(.no-gl):not(.is-ready) .fail--load { display: grid; }
  .no-gl .dock, .no-gl .toast, .load-failed:not(.is-ready) .dock, .no-gl .side, .load-failed:not(.is-ready) .side { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 760px) {
    :root { --edge-l: max(18px, env(safe-area-inset-left, 0px)); --edge-r: max(18px, env(safe-area-inset-right, 0px)); }
    .panel { grid-template-columns: 1fr auto; row-gap: 14px; }
    .dockwrap { grid-column: 1 / -1; grid-row: 1; }
    .sig { grid-column: 1; grid-row: 2; }
    .side { grid-column: 2; grid-row: 2; }
    .small { font-size: 12px; }
  }
  @media (max-width: 430px) {
    .live { height: 60px; padding: 0 20px 0 17px; font-size: 14px; }
    .toggle-wrap { width: 160px; height: 60px; }
    .toggle-wrap .toggle { transform: scale(0.69); }
    .toggle [data-tip]::after { font-size: 17.4px; padding: 9px 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    :root, :root * { transition: none !important; animation: none !important; }
    .star, .sunset-glow { opacity: 1; }
    .enter { opacity: 1; transform: none; filter: none; }
  }
</style>
