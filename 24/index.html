<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Christmas Tree</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --glow: #ffd9a0;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at 50% 72%, #2b1621 0%, #160d1d 45%, #07060f 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--glow);
    user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
  canvas:active { cursor: grabbing; }
  .vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.65) 100%);
  }
  .hint {
    position: fixed; top: 16px; left: 16px; right: 16px; text-align: center;
    font-size: .78rem; letter-spacing: .2em; text-transform: uppercase;
    color: rgba(255,220,180,.4); pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="hint">drag to spin · click to rebuild</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[(Math.random() * arr.length) | 0];
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const easeInOut = x => -(Math.cos(Math.PI * x) - 1) / 2;
  const easeOutBack = x => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const easeOutElastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -9 * x) * Math.sin((x * 9 - 0.75) * (TAU / 3)) + 1;

  // ---------- layout ----------
  let W, H, DPR, cx, baseY, TH, R, unit;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = W / 2;
    TH = Math.min(H * 0.6, W * 1.05);   // tree height
    baseY = H * 0.5 + TH * 0.5 + H * 0.04;
    R = TH * 0.37;                        // base radius
    unit = TH / 600;
  }
  addEventListener('resize', resize);
  resize();

  // ---------- tree shape ----------
  const TIERS = 6, TURNS = 6, STRANDS = 3, HMAX = 0.95;
  // radius (fraction of R) at height h (0 = bottom, 1 = top) — layered tiers
  function profile(h) {
    const frac = (h * TIERS) % 1;
    return (1 - h) * (0.76 + 0.24 * Math.pow(1 - frac, 1.4));
  }
  const strandRadius = h => (1 - h) * 0.95 + 0.015;

  // when does the spiral reach (h, a)?  Things appear right where the comets pass.
  function revealAt(h, a) {
    const s0 = h / HMAX;
    const phi = s0 * TURNS * TAU;
    let dmin = TAU;
    for (let si = 0; si < STRANDS; si++) {
      let d = (a - phi - si * TAU / STRANDS) % TAU;
      if (d < 0) d += TAU;
      dmin = Math.min(dmin, d);
    }
    return s0 + dmin / (TURNS * TAU);
  }

  let rot = 0;
  function proj(h, a, rf) {
    const ang = a + rot;
    const x = Math.cos(ang) * rf * R;
    const z = Math.sin(ang) * rf * R;
    const f = R * 4.5;
    const s = f / (f + z);
    return { x: cx + x * s, y: baseY - h * TH + z * 0.13, z, s, ang };
  }

  // ---------- palettes ----------
  const GREENS = [];
  for (let i = 0; i < 10; i++) {
    GREENS.push(`hsl(${148 - i * 2}, ${42 + i * 1.5}%, ${9 + i * 2.8}%)`);
  }
  const CREAM = '255,236,196', WARM = '255,196,112', AMBER = '255,148,52',
        GOLD = '255,214,118', RED = '255,72,62', PINK = '255,124,150';
  const STRAND_COLORS = [[CREAM, WARM], [GOLD, AMBER], [RED, GOLD, PINK, AMBER, CREAM]];
  const BAUBLES = [
    ['#ff8a8a', '#c4001f', '#3d000b'],
    ['#fff0b8', '#d9a520', '#4d3400'],
    ['#ffffff', '#c9c2e0', '#3a3350'],
  ];

  const spriteCache = {};
  function sprite(rgb) {
    if (spriteCache[rgb]) return spriteCache[rgb];
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.12, `rgba(${rgb},1)`);
    gr.addColorStop(0.3, `rgba(${rgb},.42)`);
    gr.addColorStop(0.6, `rgba(${rgb},.1)`);
    gr.addColorStop(1, `rgba(${rgb},0)`);
    g.fillStyle = gr;
    g.fillRect(0, 0, 64, 64);
    return (spriteCache[rgb] = c);
  }

  // ---------- scene objects ----------
  let needles, lights, baubles, sparks;
  function build() {
    needles = []; lights = []; baubles = []; sparks = [];

    for (let i = 0; i < 3000; i++) {
      const h = (1 - Math.sqrt(Math.random())) * 0.98;
      const a = rand(0, TAU);
      const depth = Math.sqrt(Math.random());
      const col = Math.min(GREENS.length - 1, Math.floor(depth * GREENS.length * 0.75 + Math.random() * 3));
      needles.push({ h, a, rf: profile(h) * (0.4 + 0.6 * depth), len: rand(7, 15) * (1 - h * 0.4),
                     col, reveal: revealAt(h, a), born: -1 });
    }

    // spiral light strands
    STRAND_COLORS.forEach((cols, si) => {
      const n = 120;
      for (let i = 0; i < n; i++) {
        const s = i / n, h = s * HMAX;
        lights.push({ h, a: s * TURNS * TAU + si * TAU / STRANDS, rf: strandRadius(h),
                      color: cols[i % cols.length], size: rand(22, 30) * (1 - h * 0.35),
                      phase: rand(0, TAU), sp: rand(1.2, 3.2), reveal: s, born: -1 });
      }
    });

    // tiny fairy lights tucked in the branches
    for (let i = 0; i < 280; i++) {
      const h = (1 - Math.sqrt(Math.random())) * 0.92;
      const a = rand(0, TAU);
      lights.push({ h, a, rf: profile(h) * rand(0.7, 1), color: pick([CREAM, WARM, GOLD, AMBER, CREAM]),
                    size: rand(10, 16), phase: rand(0, TAU), sp: rand(0.8, 2.5),
                    reveal: revealAt(h, a), born: -1 });
    }

    for (let i = 0; i < 34; i++) {
      const h = (1 - Math.sqrt(Math.random())) * 0.82 + 0.04;
      const a = rand(0, TAU);
      baubles.push({ h, a, rf: profile(h) * 0.96, r: rand(7, 11) * (1 - h * 0.3),
                     col: pick(BAUBLES), reveal: revealAt(h, a) + 0.01, born: -1 });
    }
  }

  // background stars + snow
  const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random() * 0.65, r: rand(0.4, 1.3), p: rand(0, TAU), s: rand(0.5, 2) }));
  const snow = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random(), r: rand(0.6, 2.8), vy: rand(14, 42), p: rand(0, TAU) }));

  // ---------- timeline ----------
  const BUILD = 10;
  let t0 = performance.now() / 1000, last = t0, bowBorn = -1, spinVel = 0.9;

  function restart() {
    build();
    t0 = performance.now() / 1000;
    bowBorn = -1;
  }
  build();

  // ---------- interaction ----------
  let dragging = false, lastX = 0, downX = 0, dragVel = 0;
  cv.addEventListener('pointerdown', e => { dragging = true; lastX = downX = e.clientX; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    rot += dx * 0.008; dragVel = dx * 0.008;
  });
  cv.addEventListener('pointerup', e => { dragging = false; if (Math.abs(e.clientX - downX) < 5) restart(); });

  // ---------- drawing ----------
  function drawBackground(t, glow) {
    for (const s of stars) {
      ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * s.s + s.p));
      ctx.fillStyle = '#fff3dc';
      ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // warm halo behind the tree
    const g = ctx.createRadialGradient(cx, baseY - TH * 0.42, 0, cx, baseY - TH * 0.42, TH * 0.75);
    g.addColorStop(0, `rgba(255,160,70,${0.2 * glow})`);
    g.addColorStop(1, 'rgba(255,160,70,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // snowy ground + warm light pool
    ctx.save();
    ctx.translate(cx, baseY + TH * 0.05);
    ctx.scale(1, 0.2);
    let gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 2.6);
    gg.addColorStop(0, 'rgba(235,238,255,.22)');
    gg.addColorStop(0.6, 'rgba(200,205,240,.08)');
    gg.addColorStop(1, 'rgba(200,205,240,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, R * 2.6, 0, TAU); ctx.fill();
    gg = ctx.createRadialGradient(0, 0, 0, 0, 0, R * 1.7);
    gg.addColorStop(0, `rgba(255,175,95,${0.35 * glow})`);
    gg.addColorStop(1, 'rgba(255,175,95,0)');
    ctx.fillStyle = gg;
    ctx.beginPath(); ctx.arc(0, 0, R * 1.7, 0, TAU); ctx.fill();
    ctx.restore();
  }

  function drawTrunk(t) {
    const k = easeOutBack(clamp((t - t0) / 0.7));
    if (k <= 0) return;
    const w = R * 0.2, top = baseY - TH * 0.03, h = TH * 0.085 * k;
    const g = ctx.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
    g.addColorStop(0, '#2a150b'); g.addColorStop(0.45, '#6b3d22'); g.addColorStop(1, '#2a150b');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.roundRect ? ctx.roundRect(cx - w / 2, top, w, h, 3 * unit) : ctx.rect(cx - w / 2, top, w, h);
    ctx.fill();
  }

  function drawNeedles(t, back) {
    const paths = GREENS.map(() => new Path2D());
    for (const n of needles) {
      if (n.born < 0) continue;
      const k = clamp((t - n.born) / 0.45);
      const p = proj(n.h, n.a, n.rf);
      if ((p.z > 0) !== back) continue;
      const L = n.len * unit * easeOutBack(k) * p.s;
      const path = paths[n.col];
      path.moveTo(p.x, p.y);
      path.lineTo(p.x + Math.cos(p.ang) * L * 0.8, p.y + L * 0.45);
    }
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(1.2, 2.1 * unit);
    ctx.globalAlpha = back ? 0.5 : 1;
    paths.forEach((path, i) => { ctx.strokeStyle = GREENS[i]; ctx.stroke(path); });
    ctx.globalAlpha = 1;
  }

  // soft body so the tree feels full; back lights glow through it
  function drawBody(buildH) {
    const topCut = baseY - Math.min(1, buildH * HMAX) * TH;
    ctx.save();
    ctx.beginPath(); ctx.rect(0, topCut, W, H); ctx.clip();
    ctx.beginPath();
    for (let h = 0; h <= 1.0001; h += 0.01) ctx.lineTo(cx - profile(h) * R * 0.9, baseY - h * TH);
    for (let h = 1; h >= -0.0001; h -= 0.01) ctx.lineTo(cx + profile(h) * R * 0.9, baseY - h * TH);
    ctx.closePath();
    const g = ctx.createLinearGradient(cx - R, 0, cx + R, 0);
    g.addColorStop(0, 'rgba(6,26,16,.82)');
    g.addColorStop(0.5, 'rgba(12,44,26,.72)');
    g.addColorStop(1, 'rgba(6,26,16,.82)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();
  }

  function drawLights(t, back) {
    ctx.globalCompositeOperation = 'lighter';
    for (const L of lights) {
      if (L.born < 0) continue;
      const p = proj(L.h, L.a, L.rf);
      if ((p.z > 0) !== back) continue;
      const k = clamp((t - L.born) / 0.5);
      const pop = easeOutBack(k) * (1 + (1 - k) * 1.2);   // flashes bright as it's born
      const tw = 0.5 + 0.5 * Math.sin(t * L.sp + L.phase);
      const size = L.size * unit * p.s * pop * (0.85 + 0.3 * tw);
      ctx.globalAlpha = (back ? 0.38 : 1) * (0.55 + 0.45 * tw);
      ctx.drawImage(sprite(L.color), p.x - size / 2, p.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawBaubles(t) {
    for (const b of baubles) {
      if (b.born < 0) continue;
      const p = proj(b.h, b.a, b.rf);
      if (p.z > 0) continue;
      const r = b.r * unit * p.s * easeOutBack(clamp((t - b.born) / 0.5));
      if (r <= 0.3) continue;
      const y = p.y + r * 0.6;
      ctx.fillStyle = '#c9a24a';
      ctx.fillRect(p.x - r * 0.25, y - r * 1.25, r * 0.5, r * 0.35);
      const g = ctx.createRadialGradient(p.x - r * 0.35, y - r * 0.35, r * 0.05, p.x, y, r);
      g.addColorStop(0, b.col[0]); g.addColorStop(0.45, b.col[1]); g.addColorStop(1, b.col[2]);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, y, r, 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(t * 2 + b.a * 5);
      ctx.drawImage(sprite(WARM), p.x - r * 0.9, y - r * 0.9, r * 1.1, r * 1.1);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawComets(t, dt, bh) {
    ctx.globalCompositeOperation = 'lighter';
    const head = Math.min(1, bh);
    for (let si = 0; si < STRANDS; si++) {
      for (let k = 0; k < 26; k++) {
        const s = head - k * 0.0032;
        if (s < 0) break;
        const h = s * HMAX;
        const p = proj(h, s * TURNS * TAU + si * TAU / STRANDS, strandRadius(h));
        const size = (46 - k * 1.5) * unit * p.s;
        ctx.globalAlpha = (1 - k / 26) * (p.z > 0 ? 0.45 : 1);
        ctx.drawImage(sprite(k === 0 ? CREAM : GOLD), p.x - size / 2, p.y - size / 2, size, size);
        if (k === 0) {
          for (let j = 0; j < 2; j++) {
            sparks.push({ x: p.x, y: p.y, vx: rand(-60, 60) * unit, vy: rand(-70, 10) * unit,
                          life: rand(0.5, 1.1), max: 1.1, color: pick([GOLD, CREAM, AMBER]) });
          }
        }
      }
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawSparks(dt) {
    ctx.globalCompositeOperation = 'lighter';
    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.life -= dt;
      if (s.life <= 0) { sparks.splice(i, 1); continue; }
      s.vy += 55 * unit * dt;
      s.vx *= 0.985; s.vy *= 0.985;
      s.x += s.vx * dt; s.y += s.vy * dt;
      const k = s.life / s.max;
      const size = 10 * unit * (0.3 + k);
      ctx.globalAlpha = k;
      ctx.drawImage(sprite(s.color), s.x - size / 2, s.y - size / 2, size, size);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  // ---------- satin ribbon & bow ----------
  const RIB_TURNS = 1.6, RIB_SEG = 150, RIB_W = 0.034;
  const ribRadius = h => (1 - h) * 0.98 + 0.04;

  function ribbonPoint(j, u, t) {
    const h = 0.975 - u * 0.9;
    const a = j * Math.PI - u * RIB_TURNS * TAU;
    const rf = ribRadius(h) + 0.012 * Math.sin(u * 26 + t * 1.5 + j);   // soft ripples
    return { h, a, rf };
  }

  function ribbonColor(ang, u, t) {
    // light from upper-left-front
    const diff = Math.max(0, Math.cos(ang) * -0.55 + Math.sin(ang) * -0.83);
    const shimmer = 0.08 * Math.sin(u * 48 - t * 2);
    const shade = clamp(0.22 + 0.78 * diff + shimmer);
    const sheen = Math.pow(diff, 14) * 0.55;
    const r = 70 + 165 * shade, g = 2 + 20 * shade, b = 12 + 30 * shade;
    return `rgb(${(r + (255 - r) * sheen) | 0},${(g + (225 - g) * sheen) | 0},${(b + (225 - b) * sheen) | 0})`;
  }

  let ribbonCache = null;
  function computeRibbons(t) {
    if (bowBorn < 0) { ribbonCache = null; return; }
    const prog = 1 - Math.pow(1 - clamp((t - bowBorn - 0.35) / 2.8), 3);
    if (prog <= 0) { ribbonCache = null; return; }
    const n = Math.max(2, Math.round(RIB_SEG * prog));
    ribbonCache = [0, 1].map(j => {
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const u = (i / RIB_SEG);
        const P = ribbonPoint(j, u, t);
        const hb = P.h - RIB_W * (u < 0.04 ? u / 0.04 : 1);     // flares out from the knot
        const top = proj(P.h, P.a, P.rf);
        const bot = proj(hb, P.a, ribRadius(hb) + (P.rf - ribRadius(P.h)));
        pts.push({ top, bot, u });
      }
      return pts;
    });
  }

  function drawRibbons(t, back) {
    if (!ribbonCache) return;
    ctx.lineJoin = 'round';
    ctx.lineWidth = 0.8;
    for (const pts of ribbonCache) {
      for (let i = 0; i < pts.length - 1; i++) {
        const A = pts[i], B = pts[i + 1];
        if (((A.top.z + B.top.z) > 0) !== back) continue;
        const col = ribbonColor(A.top.ang, A.u, t);
        ctx.fillStyle = col; ctx.strokeStyle = col;
        ctx.globalAlpha = back ? 0.55 : 1;
        ctx.beginPath();
        ctx.moveTo(A.top.x, A.top.y);
        ctx.lineTo(B.top.x, B.top.y);
        if (i === pts.length - 2) {           // swallowtail cut at the end
          const mx = (B.top.x + B.bot.x) / 2, my = (B.top.y + B.bot.y) / 2;
          ctx.lineTo(mx + (A.top.x - B.top.x) * 3, my + (A.top.y - B.top.y) * 3);
        }
        ctx.lineTo(B.bot.x, B.bot.y);
        ctx.lineTo(A.bot.x, A.bot.y);
        ctx.closePath();
        ctx.fill(); ctx.stroke();
        // thin edge highlight along the upper hem
        if (!back) {
          ctx.strokeStyle = 'rgba(255,170,170,.22)';
          ctx.beginPath(); ctx.moveTo(A.top.x, A.top.y); ctx.lineTo(B.top.x, B.top.y); ctx.stroke();
        }
      }
    }
    ctx.globalAlpha = 1;
  }

  function satin(x0, y0, x1, y1, dark) {
    const c = dark
      ? ['#2a0005', '#6e0613', '#a8132a', '#6a0512', '#220004']
      : ['#3d0008', '#9c0c21', '#f0566a', '#c0122c', '#4a010c'];
    const g = ctx.createLinearGradient(x0, y0, x1, y1);
    g.addColorStop(0, c[0]); g.addColorStop(0.28, c[1]); g.addColorStop(0.46, c[2]);
    g.addColorStop(0.62, c[3]); g.addColorStop(1, c[4]);
    return g;
  }

  function bowLoop(angle, L, w, dark) {
    ctx.save();
    ctx.rotate(angle);
    ctx.beginPath();
    ctx.moveTo(0, -w * 0.22);
    ctx.bezierCurveTo(-L * 0.35, -w * 1.15, -L * 0.95, -w * 1.2, -L, -w * 0.1);
    ctx.bezierCurveTo(-L * 1.02, w * 0.9, -L * 0.42, w * 0.95, 0, w * 0.22);
    ctx.closePath();
    ctx.fillStyle = satin(0, -w, 0, w, dark);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    // shadowed inside of the loop
    ctx.beginPath();
    ctx.moveTo(-L * 0.28, -w * 0.12);
    ctx.bezierCurveTo(-L * 0.52, -w * 0.78, -L * 0.88, -w * 0.78, -L * 0.9, -w * 0.08);
    ctx.bezierCurveTo(-L * 0.74, -w * 0.32, -L * 0.5, -w * 0.28, -L * 0.28, -w * 0.12);
    ctx.fillStyle = 'rgba(25,0,4,.6)';
    ctx.fill();
    // soft fold crease
    ctx.beginPath();
    ctx.moveTo(-4, w * 0.06);
    ctx.bezierCurveTo(-L * 0.4, w * 0.48, -L * 0.8, w * 0.52, -L * 0.97, w * 0.18);
    ctx.strokeStyle = 'rgba(30,0,5,.35)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
    // rim sheen
    ctx.beginPath();
    ctx.moveTo(-L * 0.15, -w * 0.62);
    ctx.bezierCurveTo(-L * 0.45, -w * 1.02, -L * 0.85, -w * 1.02, -L * 0.96, -w * 0.4);
    ctx.strokeStyle = dark ? 'rgba(255,150,160,.12)' : 'rgba(255,200,205,.28)';
    ctx.lineWidth = 1.6;
    ctx.stroke();
    ctx.restore();
  }

  function drawBow(t) {
    if (bowBorn < 0) return;
    const k = clamp((t - bowBorn) / 0.9);
    if (k <= 0) return;
    const e = 1 - Math.pow(1 - k, 3);
    const sc = unit * 0.82 * (0.6 + 0.4 * e);
    ctx.save();
    ctx.globalAlpha = e;
    ctx.translate(cx, baseY - TH * 0.985);
    ctx.rotate(Math.sin(t * 1.1) * 0.02);
    ctx.scale(sc, sc);

    // warm glow behind
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 110);
    g.addColorStop(0, 'rgba(255,90,70,.22)');
    g.addColorStop(1, 'rgba(255,90,70,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 110, 0, TAU); ctx.fill();

    ctx.shadowColor = 'rgba(0,0,0,.45)';
    ctx.shadowBlur = 10;
    ctx.shadowOffsetY = 4;

    // short drapes that lead into the long ribbons
    for (const side of [1, -1]) {
      ctx.save();
      ctx.scale(side, 1);
      ctx.beginPath();
      ctx.moveTo(-4, 6);
      ctx.bezierCurveTo(6, 22, 16, 34, 30, 46);
      ctx.lineTo(44, 38);
      ctx.bezierCurveTo(30, 28, 20, 16, 12, 2);
      ctx.closePath();
      ctx.fillStyle = satin(10, 30, 40, 20, side < 0);
      ctx.fill();
      ctx.restore();
    }

    // back loops (darker, larger, angled up)
    for (const side of [1, -1]) {
      ctx.save(); ctx.scale(side, 1);
      bowLoop(0.62, 72, 25, true);
      ctx.restore();
    }
    // front loops
    for (const side of [1, -1]) {
      ctx.save(); ctx.scale(side, 1);
      bowLoop(0.14, 62, 23, false);
      ctx.restore();
    }

    // knot with wrinkles
    ctx.beginPath();
    ctx.moveTo(-12, -14);
    ctx.bezierCurveTo(-4, -18, 4, -18, 12, -14);
    ctx.bezierCurveTo(16, -4, 16, 6, 12, 15);
    ctx.bezierCurveTo(4, 19, -4, 19, -12, 15);
    ctx.bezierCurveTo(-16, 6, -16, -4, -12, -14);
    ctx.fillStyle = satin(-15, 0, 15, 0, false);
    ctx.fill();
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(40,0,6,.45)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-6, -15); ctx.bezierCurveTo(-9, -4, -9, 6, -6, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(7, -15); ctx.bezierCurveTo(9, -3, 8, 7, 6, 16); ctx.stroke();

    ctx.restore();
  }

  function drawSnow(t, dt) {
    ctx.fillStyle = '#ffffff';
    for (const f of snow) {
      f.y += (f.vy * dt) / H;
      f.x += Math.sin(t * 0.6 + f.p) * 0.00025;
      if (f.y > 1.02) { f.y = -0.02; f.x = Math.random(); }
      ctx.globalAlpha = 0.25 + f.r * 0.18;
      ctx.beginPath(); ctx.arc(f.x * W, f.y * H, f.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // ---------- main loop ----------
  function frame() {
    const t = performance.now() / 1000;
    const dt = Math.min(0.05, t - last);
    last = t;

    const bp = clamp((t - t0) / BUILD);
    const bh = bp >= 1 ? 2 : easeInOut(bp) * 1.06;

    const targetVel = bp < 1 ? 0.9 : 0.3;
    spinVel += (targetVel - spinVel) * dt * 0.8;
    if (!dragging) { rot += spinVel * dt + dragVel; dragVel *= 0.93; }

    for (const arr of [needles, lights, baubles]) {
      for (const o of arr) if (o.born < 0 && bh >= o.reveal) o.born = t;
    }

    if (bp >= 1 && bowBorn < 0) {
      bowBorn = t;
      const ty = baseY - TH;
      for (let i = 0; i < 60; i++) {
        const a = rand(0, TAU), v = rand(40, 190) * unit;
        sparks.push({ x: cx, y: ty, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40 * unit,
                      life: rand(0.8, 1.8), max: 1.8, color: pick([GOLD, CREAM, AMBER]) });
      }
    }

    ctx.clearRect(0, 0, W, H);
    drawBackground(t, Math.min(1, bh));
    drawTrunk(t);
    computeRibbons(t);
    drawRibbons(t, true);
    drawNeedles(t, true);
    drawLights(t, true);
    drawBody(bh);
    drawNeedles(t, false);
    drawBaubles(t);
    drawLights(t, false);
    drawRibbons(t, false);
    if (bp < 1) drawComets(t, dt, bh);
    drawSparks(dt);
    drawBow(t);
    drawSnow(t, dt);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
